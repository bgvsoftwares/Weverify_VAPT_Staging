<!DOCTYPE html>
<html>
<head>
    <title>Login Details Send To Candidate</title>
	<meta charset="utf-8" />
</head>
<body style="margin:0px; background:#fff;">
    <table align="center" border="0" cellpadding="0" cellspacing="0" width="600" style="background:#f4f4f4;">
        <tr>
            <td>
                <table align="center" border="0" cellpadding="0" cellspacing="0" width="600">
                    <tr>
                        <td align="left" style="padding-left:20px; padding-top:10px;">
                            <a href="#"><img src="https://bgv.securitas-india.com/Images/EmailerLogo.jpg" alt="Securitas" /></a>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
        <tr>
            <td valign="top" style="font-family:Georgia Regular; font-size:16px; padding: 0 0 5px 0;">
                <table width="100%" border="0" cellpadding="0" cellspacing="0" style="padding:0 20px;">
                    <tr>
                        <td>
                            <p style="font-family:Georgia Regular; font-size:16px; font-weight: bold; padding: 12px 0 27px 0;"><br /> Hi ,</p>
                            <p>
                                Case has been registered with given details: <br /><br /><br />

                            </p>
                        </td>
                    </tr>
                    <tr>
                        <td>Candidate Name: <b>{FCandidateName}</b> <br /><br /><br /></td>
                    </tr>
                    <tr>
                        <td>Client Reference ID : <b>{FRefNo}</b> <br /><br /><br /></td>
                    </tr>

                    <tr>
                        <td>EmailId : <b>{FCandidateEmail}</b> <br /><br /><br /></td>
                    </tr>

                    <tr>
                        <td>
                            <p>
                                <b>Thanks and Regards,</b><br />
                                {MailSignature}

                            </p>
                        </td>
                    </tr>
                    <tr>
                        <td style="font-size:12px;line-height:15px;">
                            <br /><br />
                            Please do not reply on this mail, because it is system generated mail!
                            <br /><br /><br />
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
        <tr>
            <td style="background: #df012a">
                <table align="center" border="0" cellpadding="0" cellspacing="0" width="600">
                    <tr>
                        <td style="height:40px;">&nbsp;</td>
                    </tr>
                </table>
            </td>
        </tr>
        <tr>
            <td style="height:5px;"></td>
        </tr>
    </table>

</body>
</html>
