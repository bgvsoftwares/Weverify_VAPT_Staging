 <html><head>
    <link href="~/Content/bootstrap.css" rel="stylesheet" />
    <style> 
                .frame { 
                width: 300px;  
                height: 250px;  
                border: 3px solid #ccc;  
                background: #eee;  
                margin: auto;  
                padding: 15px 10px;  
                } 
                table, thead, tr, th, td { 
                padding: 10px!important;  
                text-transform: capitalize;  
                border: 1px solid #000!important;  
                } 
                thead { 
                 padding: 10px;  
                 text-align: center;  
                font-weight: bolder;  
                font-size: 25px;  
                background: #ff450082; 
                } 
                </style> 
                <link href="/Images/report.css" rel="stylesheet" type="text/css" /> 
                </head> 
                <body> 
                <div style="margin-top: 150px;"></div> 
                <div style="margin-left:50px;margin-right:50px">
                    <div class="card-body" id="UANnoid">
                        <div class="row" style="justify-content:left;">
                            <div class="col-md-12" style="text-align:right;">
                                <img src="https://bgv.securitas-india.com/Images/PaySprintlogo.JPG" style="width:150px;" />
                            </div>
                        </div>
                        <div class="row row-sm mt-3" style="justify-content: center;">
                            <div class="col-md-11" style=" text-align: center;">
                                <h2 style="">Face Match Verification</h2>
                            </div>
                        </div>
                        <page id="PrintSrc" size="A4">
                            <div class="container" style="background: #fffdfd;">

                                <table border="1" style="width:100%;  text-align:center;">
                                    <thead style=" text-align: center;">
                                        <tr>
                                            <th colspan="2" style="background:#031f30;color:white">Face Match Output</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr>
                                            <td>CandidateName</td>
                                            <td>{CandidateName}</td>
                                        </tr>
                                        <tr>
                                            <td>Match %</td>
                                            <td>{Match}</td>
                                        </tr>
                                        <tr>
                                            <td>message</td>
                                            <td>{message}</td>
                                        </tr>
                                        <tr>
                                            <td></td>
                                            <td></td>
                                        </tr>
                                        <tr>
                                            <td>
                                                <div class="frame" style="border: 3px solid #ccc; background: #eee; margin: auto; padding: 15px 10px;">
                                                    <img class="ShowImage" src="https://bgv.securitas-india.com/Documents/CandidateDocuments/ProvidedDocuments/{Image1Name}" style="width: 300px; height: 250px;" />
                                                </div>
                                            </td>
                                            <td>
                                                <div class="frame" style="border: 3px solid #ccc; background: #eee; margin: auto; padding: 15px 10px;">
                                                    <img class="ShowImage" src="https://bgv.securitas-india.com/Documents/CandidateDocuments/ProvidedDocuments/{Image2Name}" style="width: 300px; height: 250px;" />
                                                </div>
                                            </td>
                                        </tr>
                                        <tr>
                                            <td>{Image1Remark}</td>
                                            <td>{Image2Remark}</td>
                                        </tr>                                       

                                    </tbody>

                                </table>

                                <table border="1" style="border-collapse: collapse; width:100%;  text-align: left; margin-top: 30px;">
                                    <tbody>
                                        <tr>
                                            <td style="font-weight: bolder;">Verification Status</td>
                                            <td style="font-weight: bolder;">Verified</td>
                                        </tr>
                                        <tr>
                                            <td style="font-weight: bolder;">Verification Date</td>
                                            <td>{verifiedDate}</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                           
                        </page>

                    </div>
                </div>  
                </body> 
                </html>
